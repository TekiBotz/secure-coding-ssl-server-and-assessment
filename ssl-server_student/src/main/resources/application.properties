## HTTPS configuration for the SSL server.
## The keystore password is NOT stored here. Provide it at runtime via either:
##   - the SSL_KEYSTORE_PASSWORD environment variable, or
##   - src/main/resources/application-local.properties (gitignored) with spring.profiles.active=local

server.port=8443
server.ssl.key-alias=selfsigned
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
